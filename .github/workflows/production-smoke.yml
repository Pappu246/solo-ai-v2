name: Production Smoke Gates

on:
  workflow_dispatch:
    inputs:
      run_authenticated:
        description: "Run the authenticated image-search + real-thumbnail checks"
        required: false
        default: false
        type: boolean
  deployment_status:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Deploy Supabase AI Functions"]
    types: [completed]

permissions:
  contents: read

jobs:
  public-smoke:
    name: Public production smoke
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Deploy Supabase AI Functions' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run public smoke gate
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL || 'https://solo-ai-v2-mu.vercel.app' }}
          SMOKE_SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL || 'https://vqbzyutqgjbfdwxjkplq.supabase.co' }}
          # Pull-request checks target the current production URL before a merge.
          # Validate deployment headers only on manual production checks or a successful Production deployment event.
          SMOKE_REQUIRE_SECURITY_HEADERS: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production'))) && 'true' || 'false' }}
          # Verify CSP report-only policy and report endpoint after production frontend deploys (or manual smoke).
          SMOKE_REQUIRE_CSP_REPORTING: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production'))) && 'true' || 'false' }}
          # CORS allowlist is verified only after production Edge Function deploys (or on manual runs).
          SMOKE_REQUIRE_CORS_ALLOWLIST: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Deploy Supabase AI Functions' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) && 'true' || 'false' }}
        run: node scripts/production-smoke.mjs

  csp-preview-smoke:
    name: CSP report-only preview smoke
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'security/csp-report-only-telemetry'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify CSP report-only preview
        env:
          # A manually-created preview for this exact PR head. Production alias is not changed.
          SMOKE_BASE_URL: https://solo-ai-v2-git-security-csp-report-on-306e3f-pappu246s-projects.vercel.app
          SMOKE_SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL || 'https://vqbzyutqgjbfdwxjkplq.supabase.co' }}
          SMOKE_REQUIRE_SECURITY_HEADERS: "true"
          SMOKE_REQUIRE_CSP_REPORTING: "true"
        run: node scripts/production-smoke.mjs

  authenticated-image-smoke:
    name: Authenticated image-search + thumbnail smoke
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_authenticated == true) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Deploy Supabase AI Functions' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run authenticated image smoke
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL || 'https://solo-ai-v2-mu.vercel.app' }}
          SMOKE_SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL || 'https://vqbzyutqgjbfdwxjkplq.supabase.co' }}
          SMOKE_JWT: ${{ secrets.SMOKE_JWT }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
          # Public client key (not a service-role key); used only to sign in as the smoke user.
          SMOKE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CGJc_QEGr-DBNIR7hjJI_w_vj_NmxlA
          SMOKE_REQUIRE_AUTH: "true"
        run: node scripts/production-smoke.mjs
