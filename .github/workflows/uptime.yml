name: Uptime monitor

# Free uptime alerts. Every 30 minutes, run the public smoke gate against the live
# site. On failure it opens (or comments on) ONE issue, which GitHub emails to the
# repo owner; when the site recovers, the issue is closed with a note.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Public smoke gate
        id: smoke
        continue-on-error: true
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL || 'https://solo-ai-v2-mu.vercel.app' }}
          SMOKE_SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL || 'https://vqbzyutqgjbfdwxjkplq.supabase.co' }}
        # One retry after 60 s so a single slow request never pages the owner.
        run: |
          { node scripts/production-smoke.mjs || { sleep 60; node scripts/production-smoke.mjs; }; } 2>&1 | tee smoke.log; exit "${PIPESTATUS[0]}"
      - name: Open or update the outage issue
        if: steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Uptime: Solo AI is failing its health check"
          body="$(printf 'The 30-minute uptime check failed (two attempts, 60 s apart).\n\n```\n%s\n```\n\nRun: %s/%s/actions/runs/%s' "$(tail -n 25 smoke.log)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
      - name: Close the outage issue after recovery
        if: steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Uptime: Solo AI is failing its health check"
          for number in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number'); do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the latest health check passed."
          done
      - name: Fail the run when the site is down
        if: steps.smoke.outcome == 'failure'
        run: exit 1
