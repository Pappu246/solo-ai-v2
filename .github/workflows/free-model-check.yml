name: Free model check

# Free tiers change without notice (Qwen3 Coder silently turned paid). Once a
# week, ask each provider whether our free models still exist and are free, and
# open (or update) one issue when something needs attention.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check free models
        id: check
        continue-on-error: true
        env:
          # Optional repository secrets: without them only OpenRouter is checked.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node scripts/free-model-check.mjs 2>&1 | tee check.log; exit "${PIPESTATUS[0]}"
      - name: Open or update an issue when a model needs attention
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Free model check: a model needs attention"
          body="$(printf 'The weekly free-model check failed.\n\n```\n%s\n```\n\nFix the entry in `supabase/functions/chat/providers.ts` (add an alias for the old id) and redeploy.' "$(tail -n 25 check.log)")"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
      - name: Fail the run when a model needs attention
        if: steps.check.outcome == 'failure'
        run: exit 1
