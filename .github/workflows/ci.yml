name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npx tsc -p e2e/tsconfig.json
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: true }
  edge-functions:
    name: Edge function (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { DENO_NO_PACKAGE_JSON: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno check supabase/functions/chat/context.ts supabase/functions/chat/providers.ts supabase/functions/image-search/decision.ts supabase/functions/image-search/providers.ts supabase/functions/image-proxy/index.ts
      - run: deno test supabase/functions/chat/context.test.ts supabase/functions/image-search/decision_test.ts supabase/functions/image-search/final_regression_test.ts supabase/functions/image-proxy/index_test.ts
