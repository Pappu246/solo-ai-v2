name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check
      - name: Scan tracked source for hard-coded credentials
        run: node scripts/check-secrets.mjs
      - run: node --check scripts/production-smoke.mjs
      - run: node --check api/csp-report.js
      - run: npx tsc -p e2e/tsconfig.json
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: true }
  edge-functions:
    name: Edge function (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { DENO_NO_PACKAGE_JSON: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno check supabase/functions/chat/index.ts supabase/functions/chat/context.ts supabase/functions/chat/providers.ts supabase/functions/chat/routing.ts supabase/functions/chat/health.ts supabase/functions/chat/metrics.ts supabase/functions/chat/tools.ts supabase/functions/chat/tools_test.ts supabase/functions/chat/agent.ts supabase/functions/chat/agent_test.ts supabase/functions/shared/usage.ts supabase/functions/shared/usage_test.ts supabase/functions/shared/fixed_window_rate_limit.ts supabase/functions/shared/fixed_window_rate_limit_test.ts supabase/functions/shared/cors.ts supabase/functions/shared/cors_test.ts supabase/functions/image-search/decision.ts supabase/functions/image-search/providers.ts supabase/functions/image-search/cache.ts supabase/functions/image-search/index.ts supabase/functions/image-proxy/index.ts supabase/functions/web-search/providers.ts supabase/functions/web-search/safeFetch.ts supabase/functions/web-search/events.ts supabase/functions/shared/access.ts supabase/functions/shared/access_test.ts supabase/functions/shared/mail.ts supabase/functions/request-access/index.ts supabase/functions/request-access/logic.ts supabase/functions/request-access/logic_test.ts supabase/functions/access-approve/index.ts
      - run: deno test supabase/functions/chat/context.test.ts supabase/functions/chat/providers_test.ts supabase/functions/chat/routing_test.ts supabase/functions/chat/health_test.ts supabase/functions/chat/metrics_test.ts supabase/functions/chat/tools_test.ts supabase/functions/chat/agent_test.ts supabase/functions/shared/usage_test.ts supabase/functions/shared/fixed_window_rate_limit_test.ts supabase/functions/shared/cors_test.ts supabase/functions/image-search/decision_test.ts supabase/functions/image-search/final_regression_test.ts supabase/functions/image-search/providers_test.ts supabase/functions/image-proxy/index_test.ts supabase/functions/web-search/providers_test.ts supabase/functions/shared/access_test.ts supabase/functions/request-access/logic_test.ts
