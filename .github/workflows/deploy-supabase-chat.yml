name: Deploy Supabase AI Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/chat/**"
      - "supabase/functions/image-search/**"
      - "supabase/functions/image-proxy/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-chat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Keep the target configurable per repository environment; never pin a
      # possibly obsolete project ref in source control.
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          if [[ -z "${SUPABASE_PROJECT_ID:-}" ]]; then
            echo "::error::Missing GitHub Actions variable SUPABASE_PROJECT_ID."
            exit 1
          fi
          if [[ ! "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_ID must be a 20-character Supabase project ref."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy chat Edge Function
        run: supabase functions deploy chat --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy image-search Edge Function
        run: supabase functions deploy image-search --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy image-proxy Edge Function
        run: supabase functions deploy image-proxy --project-ref "$SUPABASE_PROJECT_ID"
