name: Deploy Supabase Chat Function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/chat/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-chat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: vqbzyutqgjbfdwxjkplq
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy chat Edge Function
        run: supabase functions deploy chat --project-ref "$SUPABASE_PROJECT_ID"
