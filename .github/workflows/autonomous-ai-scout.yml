name: Solo AI Autonomous Scout

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: autonomous-ai-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent dependencies
        run: python -m pip install -r autonomous-agent/requirements.txt

      - name: Run autonomous scout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python autonomous-agent/agent.py

      - name: Persist scout state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autonomous-agent/state.json autonomous-agent/latest-report.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(agent): update autonomous scout state"
          git push
