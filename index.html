<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f5" />
    <meta name="description" content="Solo AI — a premium AI workspace: chat with the best model for every task." />
    <meta property="og:title" content="Solo AI" />
    <meta property="og:description" content="A premium AI workspace: chat with the best model for every task." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Solo AI</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // The warm light theme is the default; "system" still follows the OS.
      try {
        var s = JSON.parse(localStorage.getItem('solo-ai-settings') || '{}');
        var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var t = s.theme === 'dark' ? 'dark'
              : s.theme === 'light' || s.theme === undefined ? 'light'
              : mq ? 'dark' : 'light';
        if (t === 'dark') document.documentElement.classList.add('dark');
        if (s.accent) document.documentElement.setAttribute('data-accent', s.accent);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
